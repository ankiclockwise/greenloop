# Development profile - uses H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:greenloop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Disable mail auto-configuration in dev (no real SMTP needed)
spring:
  mail:
    host: localhost
    port: 25
    username: dev@localhost
    password: dev
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dev-dummy-client-id
            client-secret: dev-dummy-client-secret